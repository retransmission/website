{%- assign rel = site.data.release -%}
<html>

	<head>
		<meta http-equiv="content-type" content="text/html;charset=utf-8">
		<title>What's new in {{ site.brand }}?</title>
		<meta name="robots" content="anchors">
		<link href="releasenotes.css" type="text/css" rel="stylesheet" media="all">
	</head>

	<body>
			<h1>Highlights include:</h1>
			<ul>
			{% for note in rel.notes %}<li>{% if forloop.first %}{{ rel.version }}: {% endif %}{{ note }}</li>
			{% endfor %}</ul>

			<p>For a full list of changes, <a href="{{ site.releases_url }}/tag/{{ rel.version }}">click here</a>.</p>
	</body>

</html>
