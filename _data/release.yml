# Single source of truth for the current stable release.
#
# To publish a new version, edit the fields below. The download page, homepage,
# appcast.xml, and release notes all read from here — no other files need
# per-release edits.
#
# NOTE: 4.1.3 is staged. The fork's binaries are not published yet, so the
# sha256 checksums and dsa_signature are placeholders, and download links will
# 404 until the release is cut.

version: "4.1.3"
pubdate: "Mon, 29 Jun 2026 21:00:00 -0400"   # appcast <pubDate>, RFC-822
sparkle_version: "14718.1.399"               # appcast <sparkle:version> (build)
min_macos: "11.0"                            # display text + minimum system version

# Sparkle signature for the macOS DMG. Regenerate with the fork's signing key.
dsa_signature: ""                            # TODO: fill when the 4.1.3 DMG is signed

# SHA256 checksums. Fill when the 4.1.3 artifacts are published; while empty,
# the checksum section is omitted from the download page.
sha256:
  dmg: ""
  win_x64: ""
  win_x86: ""
  win_qt5_x64: ""
  win_qt5_x86: ""
  tarxz: ""

# Release-notes highlights. The version is prepended to the first bullet.
notes:
  - "Stability and performance fixes."
  - "Updated app icon for Liquid Glass."
  - "Improved µTP download performance."
  - "Added support for IPv6 and dual-stack UDP trackers."
  - "Support trackers that only support the old BEP-7 with &ipv4= and &ipv6=."
  - "New JSON-RPC 2.0-compliant RPC API."
  - "Fixed 4.0.6 bug where Transmission might spam HTTP tracker announces."
